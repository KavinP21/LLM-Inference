<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Instinct's icon: a text cursor that reads as a lowercase i, dotted
       with a block cursor in signal orange. Rendered to AppIcon.png at 1024px; macos/build.sh makes
       the .icns from that. The same drawing is #instinct-mark in index.html. -->
  <defs>
    <filter id="shadow" x="-0.1" y="-0.1" width="1.2" height="1.25">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1b1a18" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>
  <g transform="translate(512 512) scale(19) translate(-16 -16)">
    <rect x="10" y="12.15" width="12" height="2.4" rx="1.2" fill="#f3efe7"/>
    <rect x="14.5" y="12.15" width="3" height="16.4" fill="#f3efe7"/>
    <rect x="10" y="26.15" width="12" height="2.4" rx="1.2" fill="#f3efe7"/>
    <rect x="13.2" y="3.45" width="5.6" height="5.6" rx="1.1" fill="#f0612a"/>
  </g>
</svg>
