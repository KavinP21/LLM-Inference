name: prefix-cache-contract

on:
  push:
  pull_request:

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install numpy pytest
      - run: PYTHONPATH=python python3 -m pytest -q tests/test_runtime.py tests/test_prefix_cache.py tests/test_prefix_checkpoint.py
