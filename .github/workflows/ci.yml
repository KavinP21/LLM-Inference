name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.16,<0.17'
      - run: ruff check --output-format github python benchmarks tests tools
      - run: ruff format --check python benchmarks tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: macos-14, python: '3.12' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cmake -S . -B build -G Ninja -DINSTINCT_ENABLE_CUDA=OFF -DINSTINCT_BUILD_PYTHON=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # No MLX or model weights here; Metal and model tests skip themselves.
      - run: python -m pip install numpy pytest safetensors Pillow
      - run: python -m pytest -q
        env:
          PYTHONPATH: python
          INSTINCT_INSPECT_MODEL: build/instinct-inspect-model
      - run: bash -n tools/*.sh

  mlx-linux:
    # The MLX engine on Linux without Metal, through the same portable kernels
    # it uses on NVIDIA with MLX's CUDA build. Here MLX runs on the CPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "mlx[cpu]==0.32.4" numpy pytest safetensors
      - run: python -m pytest -q tests/test_mlx_engine.py tests/test_portable_kernels.py
        env:
          PYTHONPATH: python

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          cmake -S . -B build -G Ninja -DINSTINCT_ENABLE_CUDA=OFF -DINSTINCT_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_model_file_reader.py
        env:
          PYTHONPATH: python
          INSTINCT_INSPECT_MODEL: build/instinct-inspect-model

  cuda-build:
    # Compile only. Hosted runners have no NVIDIA GPU, so the CUDA tests are
    # built here but not run.
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          apt-get update && apt-get install -y --no-install-recommends
          cmake ninja-build python3-dev pybind11-dev
      - run: cmake -S . -B build -G Ninja -DINSTINCT_ENABLE_CUDA=ON -DINSTINCT_BUILD_PYTHON=ON
      - run: cmake --build build
