name: host

on:
  push:
  pull_request:

jobs:
  portable-host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -G Ninja -DFORGE_ENABLE_CUDA=OFF -DFORGE_BUILD_PYTHON=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install numpy pytest safetensors
      - run: >-
          FORGE_INSPECT_MODEL=build/forge-inspect-model PYTHONPATH=python python3 -m pytest -q
          tests/test_format.py tests/test_model_file_reader.py
          tests/test_runtime.py tests/test_benchmark.py tests/test_quantization.py tests/test_int8_quality_metrics.py
          tests/test_precision_policy.py
          tests/test_second_order.py
          tests/test_second_order_driver.py
          tests/test_cached_policy.py tests/test_cached_driver.py tests/test_cached_final_audit.py
          tests/test_scale_aware.py tests/test_scale_driver.py tests/test_scale_objective_readback.py tests/test_scale_final_audit.py
          tests/test_refined.py tests/test_refined_driver.py tests/test_refined_objective_readback.py tests/test_refined_final_audit.py
          tests/test_gpu_evidence_guard.py
          tests/test_int8_batch_driver.py
          tests/test_decode_policy.py
          tests/test_batch_numerics_driver.py
          tests/test_batch_evidence_audit.py
          tests/test_speculative.py tests/test_request_history.py tests/test_import_mlx.py
          tests/test_agent_runtime.py tests/test_agent_runtime_native.py tests/test_agent_completion.py
          tests/test_agent_native_batches.py tests/test_agent_native_tools.py tests/test_agent_mlx_lm_runner.py
          tests/test_agent_workers.py tests/test_agent_integration.py tests/test_agent_tools.py
          tests/test_agent_profiles.py tests/test_agent_evaluation.py
      - run: bash -n tools/verify_wsl_environment.sh tools/run_sanitizer.sh

  sanitized-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          cmake -S . -B build -G Ninja -DFORGE_ENABLE_CUDA=OFF -DFORGE_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install numpy pytest
      - run: >-
          FORGE_INSPECT_MODEL=build/forge-inspect-model PYTHONPATH=python python3 -m pytest -q
          tests/test_quantization.py tests/test_model_file_reader.py
