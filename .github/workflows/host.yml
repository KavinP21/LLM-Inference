name: host

on:
  push:
  pull_request:

jobs:
  portable-host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DFORGE_ENABLE_CUDA=OFF -DFORGE_BUILD_PYTHON=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install numpy pytest
      - run: >-
          PYTHONPATH=python python3 -m pytest -q
          tests/test_format.py tests/test_model_file_reader.py
          tests/test_runtime.py tests/test_benchmark.py
      - run: bash -n tools/verify_wsl_environment.sh tools/run_sanitizer.sh
