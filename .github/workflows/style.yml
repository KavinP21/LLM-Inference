name: style

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.16,<0.17'
      - run: ruff check --output-format github python benchmarks tests tools/forge_chat.py
      - run: ruff format --check python benchmarks tests tools/forge_chat.py
