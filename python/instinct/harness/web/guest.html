<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Instinct</title>
  <link rel="stylesheet" href="/guest.css">
</head>
<body>
  <svg width="0" height="0" class="defs" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 32 32">
      <g class="mark-ink"><rect x="10" y="12.15" width="12" height="2.4" rx="1.2"/><rect x="14.5" y="12.15" width="3" height="16.4"/><rect x="10" y="26.15" width="12" height="2.4" rx="1.2"/></g>
      <rect class="mark-dot" x="13.2" y="3.45" width="5.6" height="5.6" rx="1.1"/>
    </symbol>
  </svg>

  <main class="sign-in" id="sign-in" hidden>
    <svg class="sign-in-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg>
    <h1>Instinct</h1>
    <p id="sign-in-text">Open the invite link you were sent, or paste it here.</p>
    <form id="invite-form"><input id="invite-input" autocomplete="off" spellcheck="false" placeholder="https://…/#invite=inv_…" aria-label="Invite link"><button class="button button-primary" type="submit">Continue</button></form>
    <p class="error" id="sign-in-error" hidden></p>
  </main>

  <div class="app" id="app" hidden>
    <aside class="rail">
      <div class="rail-top"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand">Instinct</span></div>
      <button class="new-chat" id="new-chat" type="button">New chat</button>
      <nav class="chats" id="chats" aria-label="Chats"></nav>
      <div class="rail-foot">
        <p class="guest-of" id="guest-of"></p>
        <button class="link" id="sign-out" type="button">Sign out</button>
      </div>
    </aside>

    <section class="main">
      <header class="bar">
        <button class="folder" id="folder" type="button" title="The folder on your computer the agents work in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3l1.5 1.5h6.5A1.5 1.5 0 0 1 17 8v6.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/></svg><span id="folder-name">Choose a folder</span></button>
        <span class="local-note">Files and chats stay on this computer</span>
      </header>

      <div class="log" id="log" aria-live="polite">
        <div class="welcome" id="welcome">
          <h2>What are you working on?</h2>
          <p>Pick a folder on your computer and the agents can read and change files in it, like a coding assistant. Or just ask: math, writing, questions.</p>
          <p class="fine" id="welcome-fine"></p>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="message" rows="3" placeholder="Ask anything, or describe a change to make in your folder" aria-label="Message"></textarea>
        <div class="composer-bar">
          <select id="model" aria-label="Model"></select>
          <select id="effort" aria-label="Thinking"><option value="off">No thinking</option><option value="low">Think a little</option><option value="medium">Think more</option><option value="high">Think hard</option></select>
          <select id="mode" aria-label="Permissions"><option value="ask">Ask before changes</option><option value="auto">Make changes</option><option value="read">Read only</option></select>
          <span class="status" id="status"></span>
          <button class="button" id="stop" type="button" hidden>Stop</button>
          <button class="button button-primary" id="send" type="submit">Send</button>
        </div>
      </form>
    </section>
  </div>

  <dialog id="approval" class="approval">
    <form method="dialog">
      <h3 id="approval-title"></h3>
      <pre id="approval-body"></pre>
      <div class="approval-actions"><button class="button" value="deny">Don't allow</button><button class="button button-primary" value="allow">Allow</button></div>
    </form>
  </dialog>

  <script src="/guest.js"></script>
</body>
</html>
