[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "forge-llm"
version = "0.1.0"
description = "A focused CUDA and MLX/Metal inference runtime for Qwen2 and Gemma 3"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
export = ["torch>=2.4", "transformers>=4.50,<6", "safetensors>=0.4"]
mlx = ["mlx>=0.32,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'"]
test = ["pytest>=8"]
dev = ["ruff>=0.16,<0.17"]
reference = ["torch>=2.4", "transformers>=4.50,<6", "safetensors>=0.4"]
agents = ["transformers>=4.50,<6", "safetensors>=0.4"]

[project.scripts]
forge-export = "forge_llm.export:main"
forge-quantize = "forge_llm.quantization:main"
forge-bench = "forge_llm.benchmark:main"
forge-bench-reference = "forge_llm.benchmark_reference:main"
forge-correctness = "forge_llm.correctness:main"
forge-validate-long-context = "forge_llm.long_context:main"
forge-profile-attention = "forge_llm.profile_attention:main"
forge-profile-int8 = "forge_llm.profile_int8:main"
forge-validate-int8 = "forge_llm.validate_int8:main"
forge-calibrate-int8 = "forge_llm.calibrate_int8:main"
forge-calibrate-second-order = "forge_llm.calibrate_second_order:main"
forge-calibrate-cached = "forge_llm.calibrate_cached:main"
forge-agents = "forge_llm.agents.cli:main"
forge-worker = "forge_llm.agents.worker:main"
forge-import-mlx = "forge_llm.import_mlx:main"

[tool.scikit-build]
cmake.args = ["-DFORGE_BUILD_PYTHON=ON"]
wheel.packages = ["python/forge_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Optional backend/reference imports follow pytest.importorskip in these tests.
"tests/*.py" = ["E402"]
