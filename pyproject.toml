[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "instinct"
version = "0.1.0"
description = "A local coding agent for Apple silicon, on a from-scratch MLX/Metal and CUDA inference engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
export = ["torch>=2.4", "transformers>=4.50,<6", "safetensors>=0.4"]
mlx = ["mlx>=0.32,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'"]
test = ["pytest>=8", "Pillow>=10"]
dev = ["ruff>=0.16,<0.17"]
# Reference implementations the tests compare against.
reference = ["torch>=2.4", "transformers>=4.50,<6", "safetensors>=0.4", "mlx-vlm==0.7.6; platform_system == 'Darwin' and platform_machine == 'arm64'"]
agents = ["transformers>=5.14,<6", "safetensors>=0.8", "huggingface-hub>=1.0", "Pillow>=10"]

[project.scripts]
instinct-export = "instinct.export:main"
instinct-bench = "instinct.benchmark:main"
instinct-bench-reference = "instinct.benchmark_reference:main"
instinct-correctness = "instinct.correctness:main"
instinct-agents = "instinct.agents.cli:main"
instinct-server = "instinct.harness.cli:main"
instinct-worker = "instinct.agents.worker:main"
instinct-prepare-models = "instinct.prepare_models:main"

[tool.scikit-build]
cmake.args = ["-DINSTINCT_BUILD_PYTHON=ON"]
wheel.packages = ["python/instinct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Optional backend/reference imports follow pytest.importorskip in these tests.
"tests/*.py" = ["E402"]
